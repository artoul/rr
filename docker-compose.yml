version: "3.9"

services:
  app:
    build: .
    image: rr-app:latest
    container_name: rr-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/usr/src/app/uploads
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: rr-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: painting_generator
      MYSQL_USER: app
      MYSQL_PASSWORD: password123
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - rr-mysql-data:/var/lib/mysql
    networks:
      - app-network

volumes:
  rr-mysql-data:

networks:
  app-network:
    driver: bridge


